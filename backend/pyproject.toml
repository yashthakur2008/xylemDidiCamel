[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaklens-backend"
version = "0.2.0"
description = "Simulation-only Water Quality incident response API"
requires-python = ">=3.11"
dependencies = ["fastapi==0.165.0", "uvicorn==0.54.0", "pydantic==2.14.4", "starlette==1.10.0"]

[project.scripts]
leaklens-demo = "leaklens.dev:main"

[tool.setuptools.packages.find]
include = ["leaklens*"]
