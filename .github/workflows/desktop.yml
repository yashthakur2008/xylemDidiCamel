name: Desktop installers
on:
  workflow_dispatch:
  push:
    branches: [feat/leaklens-backend]
    paths: ['desktop/**', 'backend/**', 'frontend/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-arm64
            executable: dist/mac-arm64/LeakLens.app/Contents/MacOS/LeakLens
          - os: windows-latest
            artifact: windows-x64
            executable: dist/win-unpacked/LeakLens.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend and build tools
        run: python -m pip install -e ./backend pytest httpx PyInstaller==6.20.0
      - name: Backend regression tests
        run: python -m pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm ci --prefix desktop
      - run: npm run build --prefix frontend
      - name: Bundle platform Python runtime
        run: python desktop/scripts/build-backend.py
      - name: Build unpacked desktop app
        working-directory: desktop
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Exercise packaged app without developer runtimes
        working-directory: desktop
        run: npm run test:desktop
        env:
          LEAKLENS_PACKAGED: ${{ matrix.executable }}
      - name: Build installer
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and exercise Windows setup output
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not produced' }
          $destination = Join-Path $env:RUNNER_TEMP 'LeakLens-acceptance'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $env:LEAKLENS_PACKAGED = Join-Path $destination 'LeakLens.exe'
          if (-not (Test-Path $env:LEAKLENS_PACKAGED)) { throw 'Installed executable missing' }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LeakLens-${{ matrix.artifact }}-unsigned
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-evidence-${{ matrix.artifact }}
          path: desktop/test-results
